<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Drawer | 무비서랍</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111318;color:#f5f2eb}
*{box-sizing:border-box} body{margin:0} main,header,footer{width:min(1060px,90%);margin:auto}
header{padding:25px 0;border-bottom:1px solid #363941;font-weight:800} header span{color:#f6bd73}
.hero{padding:62px 0 38px}.eyebrow{color:#f6bd73;font-size:.8rem;font-weight:800;letter-spacing:.17em}
h1{font-size:clamp(2.4rem,7vw,4.7rem);margin:.15em 0;letter-spacing:-.06em}
p{line-height:1.65;color:#c7c8ce} form{max-width:600px;display:flex;gap:8px}
input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #555a64}
input{min-width:0;flex:1;background:#20232b;color:inherit} button{cursor:pointer}
form button{background:#f6bd73;color:#21160a;font-weight:800;border-color:transparent}
:focus-visible{outline:3px solid #f6bd73;outline-offset:4px}
.section-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.section-title h2{margin:0}
#status{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:18px;margin-top:18px}
.card{width:100%;text-align:left;padding:0;overflow:hidden;background:#20232b;color:inherit}
.card:hover{border-color:#f6bd73}.art{aspect-ratio:4/5;display:grid;place-items:center;background:radial-gradient(ellipse at 20% 10%,var(--accent),transparent 65%),linear-gradient(145deg,#212634,#111318);color:#fff;font-size:clamp(3rem,9vw,6rem);font-weight:900}
.caption{display:block;padding:15px}.caption strong,.caption small{display:block}.caption small{margin-top:5px;color:#c7c8ce}
footer{margin-top:48px;padding:20px 0;border-top:1px solid #363941;color:#c7c8ce;font-size:.85rem}
dialog{width:min(540px,90vw);background:#20232b;color:inherit;border:1px solid #555a64;border-radius:16px;padding:25px}
dialog::backdrop{background:#08090dd9} dialog form{justify-content:flex-end}
.poster{width:100%;height:100%;object-fit:cover}.credentials{margin-top:15px;max-width:600px}.credentials input{display:block;width:100%;margin-top:8px}.credentials p{font-size:.85rem}
.retry{margin:10px 0;background:#272b35;color:inherit}
.art{position:relative;overflow:hidden;aspect-ratio:2/3}
.art.placeholder{font-size:1.1rem}.art .poster{position:absolute;inset:0}
.card{align-self:start}.caption{overflow-wrap:anywhere}
dialog{max-height:85vh;overflow:auto;overflow-wrap:anywhere}
@media(max-width:560px){
  .hero{padding:34px 0 28px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .caption{padding:10px}
  input,button{min-height:44px}
}
@media(max-width:320px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><span>▣</span> MOVIE DRAWER</header>
<main>
<section class="hero" aria-labelledby="hero-title">
  <p class="eyebrow">영화 탐색</p>
  <h1 id="hero-title">오늘은 무슨 영화?</h1>
  <p>영화 제목을 검색하고 카드에서 작품 정보를 확인하세요.</p>
  <form id="search" role="search">
    <input id="query" type="search" aria-label="영화 제목" placeholder="예: 기생충, 인터스텔라">
    <button type="submit">검색</button>
  </form>
  <details class="credentials">
    <summary>TMDB 실시간 검색 설정</summary>
    <label for="token">API Read Access Token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" aria-describedby="token-help">
    <p id="token-help">토큰을 입력한 뒤 영화 제목을 검색하세요. 토큰을 비워 두면 샘플 영화 3편에서 검색합니다. 입력한 토큰은 이 페이지에만 유지됩니다.</p>
  </details>
</section>
<section aria-labelledby="results-title">
  <div class="section-title"><h2 id="results-title">샘플 영화</h2><p id="status" role="status"></p></div>
  <button class="retry" id="search-retry" type="button" hidden>검색 다시 시도</button>
  <div id="results" class="grid"></div>
</section>
</main>
<footer>Movie Drawer · 영화 데이터 및 포스터 제공 <a href="https://www.themoviedb.org/">TMDB</a><br>This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
<dialog id="details" aria-labelledby="movie-title">
  <form method="dialog"><button autofocus>닫기</button></form>
  <h2 id="movie-title"></h2>
  <p id="detail-status" role="status" hidden></p>
  <button class="retry" id="detail-retry" type="button" hidden>상세 정보 다시 시도</button>
  <p id="movie-meta"></p>
  <p id="movie-overview"></p>
</dialog>
<script>
const movies = [
  { title: '기생충', original_title: 'Parasite', release_date: '2019-05-30', genre: '드라마 · 스릴러', vote_average: 8.5, overview: '기택의 아들 기우가 부유한 박 사장 가족의 과외 교사가 되면서 두 가족의 삶이 얽히기 시작한다.', symbol: '▥', accent: '#45694e' },
  { title: '인터스텔라', original_title: 'Interstellar', release_date: '2014-11-06', genre: 'SF · 모험', vote_average: 8.7, overview: '지구의 환경이 악화되자 우주비행사 쿠퍼는 인류가 살아갈 새로운 터전을 찾기 위해 우주로 떠난다.', symbol: '◉', accent: '#735a38' },
  { title: '라라랜드', original_title: 'La La Land', release_date: '2016-12-07', genre: '로맨스 · 뮤지컬', vote_average: 8.0, overview: '배우 지망생 미아와 재즈 피아니스트 세바스찬은 로스앤젤레스에서 만나 각자의 꿈을 향해 나아간다.', symbol: '✦', accent: '#704d87' }
];

const search = document.querySelector('#search');
const query = document.querySelector('#query');
const results = document.querySelector('#results');
const details = document.querySelector('#details');
const token = document.querySelector('#token');
const resultsTitle = document.querySelector('#results-title');
const status = document.querySelector('#status');
let activeSearch;
let activeDetail;
const detailStatus = document.querySelector('#detail-status');
const searchRetry = document.querySelector('#search-retry');
const detailRetry = document.querySelector('#detail-retry');

function resetSearchRetry() {
  searchRetry.hidden = true;
  searchRetry.onclick = null;
}

function showSearchError(message, term) {
  status.textContent = message;
  searchRetry.hidden = false;
  searchRetry.onclick = () => {
    const accessToken = token.value.trim();
    if (accessToken) {
      searchTmdb(term, accessToken);
    } else {
      status.textContent = 'TMDB 토큰을 입력한 뒤 다시 시도하세요.';
      token.closest('details').open = true;
      token.focus();
    }
  };
}

function renderDetails(movie) {
  document.querySelector('#movie-title').textContent = movie.title;
  document.querySelector('#movie-meta').textContent =
    [movie.genre, movie.release_date || '개봉일 미정'].filter(Boolean).join(' · ');
  document.querySelector('#movie-overview').textContent =
    movie.overview || '등록된 줄거리가 없습니다.';
}

async function openDetails(movie, accessToken) {
  renderDetails(movie);
  detailStatus.hidden = true;
  detailRetry.hidden = true;
  detailRetry.onclick = null;
  if (!details.open) details.showModal();
  if (!accessToken) return;

  const request = new AbortController();
  activeDetail?.abort();
  activeDetail = request;
  detailStatus.hidden = false;
  detailStatus.textContent = '상세 정보를 불러오는 중입니다…';

  try {
    const url = new URL('https://api.themoviedb.org/3/movie/' + encodeURIComponent(movie.id));
    url.searchParams.set('language', 'ko-KR');
    const response = await fetch(url, {
      headers: { Authorization: 'Bearer ' + accessToken, Accept: 'application/json' },
      signal: request.signal
    });
    if (!response.ok) throw new Error('TMDB request failed');
    const data = await response.json();
    if (activeDetail !== request || !details.open) return;

    renderDetails({
      title: data.title || movie.title,
      release_date: data.release_date || movie.release_date,
      overview: data.overview || movie.overview,
      genre: data.genres?.map(genre => genre.name).join(' · ')
    });
    detailStatus.hidden = true;
  } catch {
    if (activeDetail === request && details.open) {
      detailStatus.textContent = '상세 정보를 가져오지 못했습니다. 아래 버튼으로 다시 시도하세요.';
      detailRetry.hidden = false;
      detailRetry.onclick = () => openDetails(movie, token.value.trim() || accessToken);
    }
  } finally {
    if (activeDetail === request) activeDetail = undefined;
  }
}

details.addEventListener('close', () => {
  if (details.open) return;
  activeDetail?.abort();
  detailRetry.onclick = null;
});

async function searchTmdb(term, accessToken) {
  activeSearch?.abort();
  const request = new AbortController();
  activeSearch = request;
  resetSearchRetry();
  resultsTitle.textContent = 'TMDB 검색 결과';
  results.replaceChildren();
  status.textContent = '영화를 검색하는 중입니다…';
  try {
    const url = new URL('https://api.themoviedb.org/3/search/movie');
    url.search = new URLSearchParams({ query: term, language: 'ko-KR', include_adult: 'false' });
    const response = await fetch(url, {
      headers: { Authorization: 'Bearer ' + accessToken, Accept: 'application/json' },
      signal: request.signal
    });
    if (request.signal.aborted) return;
    if (!response.ok) {
      showSearchError(response.status === 401
        ? '인증에 실패했습니다. API Read Access Token을 확인한 뒤 다시 검색하세요.'
        : 'TMDB 요청에 실패했습니다. 잠시 후 다시 검색하세요.', term);
      return;
    }
    const data = await response.json();
    if (!request.signal.aborted) renderCards(data.results, 'TMDB 검색 결과', accessToken);
  } catch {
    if (!request.signal.aborted) showSearchError('TMDB에 연결할 수 없습니다. 연결을 확인한 뒤 다시 시도하세요.', term);
  } finally {
    if (activeSearch === request) activeSearch = undefined;
  }
}

function renderMovies(searchTerm = '') {
  resetSearchRetry();
  const term = searchTerm.trim().toLowerCase();
  const matches = movies.filter(movie =>
    [movie.title, movie.original_title].some(title => title.toLowerCase().includes(term))
  );
  renderCards(matches, term ? '샘플 검색 결과' : '샘플 영화');
}

function renderCards(matches, heading, accessToken) {
  resultsTitle.textContent = heading;
  document.querySelector('#status').textContent = matches.length ? matches.length + '편' : '일치하는 영화가 없습니다. 다른 제목으로 검색해 보세요.';
  results.replaceChildren(...matches.map(movie => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';

    const art = document.createElement('span');
    art.className = movie.symbol ? 'art' : 'art placeholder';
    art.setAttribute('aria-hidden', 'true');
    art.style.setProperty('--accent', movie.accent || '#454b5c');
    art.textContent = movie.symbol || '포스터 없음';
    if (movie.poster_path) {
      const poster = document.createElement('img');
      poster.className = 'poster';
      poster.alt = '';
      poster.loading = 'lazy';
      poster.addEventListener('error', () => { art.textContent = '포스터 없음'; }, { once: true });
      poster.src = 'https://image.tmdb.org/t/p/w500' + movie.poster_path;
      art.replaceChildren(poster);
    }

    const caption = document.createElement('span');
    caption.className = 'caption';
    const title = document.createElement('strong');
    title.textContent = movie.title;
    const meta = document.createElement('small');
    meta.textContent = [(movie.release_date || '').slice(0, 4) || '연도 미정', movie.vote_count === 0 ? '평점 없음' : '★ ' + movie.vote_average.toFixed(1)].join(' · ');
    caption.append(title, meta);
    card.append(art, caption);

    card.addEventListener('click', () => openDetails(movie, accessToken));
    return card;
  }));
}

search.addEventListener('submit', event => {
  event.preventDefault();
  const term = query.value.trim();
  const accessToken = token.value.trim();
  if (term && accessToken) {
    searchTmdb(term, accessToken);
  } else {
    activeSearch?.abort();
    renderMovies(term);
  }
});
query.addEventListener('input', () => {
  if (!query.value.trim()) {
    activeSearch?.abort();
    renderMovies();
  }
});
renderMovies();
</script>
</body>
</html>
